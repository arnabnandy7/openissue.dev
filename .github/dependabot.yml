version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      all-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      all-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
